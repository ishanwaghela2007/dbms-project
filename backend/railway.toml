# railway.toml — College ERP monorepo backend
# Deploy each [[services]] block as a separate Railway service.
# Railway reads this from the repo root; point each service at backend/ as the
# root directory in the Railway dashboard → Settings → Root Directory.
#
# HOW TO USE:
#   1. railway login
#   2. railway link  (select / create project)
#   3. For each service, run:
#        railway service create <name>
#        railway variables set ... (see RAILWAY_ENV_VARS.md)
#        railway up --service <name>
#   OR use the dashboard "New Service → GitHub Repo" flow and set:
#        Root Directory  = backend
#        Start Command   = (see per-service commands below)

[build]
builder      = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# ── Gateway ────────────────────────────────────────────────────────────────────
[[services]]
name         = "gateway"
startCommand = "node src/gateway/server.js"

[services.env]
SERVICE_NAME          = "gateway"
NODE_ENV              = "production"
TRUST_PROXY           = "1"          # Railway sits behind a proxy
REQUIRE_HTTPS         = "true"
GRPC_SECURITY_MODE    = "insecure"   # upgrade to mtls when you add TLS certs

# ── Auth ───────────────────────────────────────────────────────────────────────
[[services]]
name         = "auth"
startCommand = "node src/services/auth/index.js"

[services.env]
SERVICE_NAME          = "auth"
NODE_ENV              = "production"
AUTH_GRPC_ADDR        = "0.0.0.0:50051"
GRPC_SECURITY_MODE    = "insecure"

