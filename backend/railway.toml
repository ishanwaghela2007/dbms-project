# railway.toml — College ERP Backend
#
# Railway deploys ONE service per repo link. To deploy all 8 services:
#
#  1. In the Railway dashboard, create a NEW SERVICE for each one from the same
#     GitHub repo (ishanwaghela2007/dbms-project).
#  2. For each service set:
#       Root Directory  = backend
#       Start Command   = (see table below)
#  3. Set the env vars from RAILWAY_ENV_VARS.md in each service's Variables tab.
#
#  Service start commands:
#    gateway      → node src/gateway/server.js
#    auth         → node src/services/auth/index.js
#    profile      → node src/services/profile/index.js
#    academic     → node src/services/academic/index.js
#    marks        → node src/services/marks/index.js
#    attendance   → node src/services/attendance/index.js
#    paper        → node src/services/paper/index.js
#    notification → node src/services/notification/index.js
#
# This file controls the GATEWAY service (the public-facing one).
# Override startCommand in each service's Railway dashboard settings.

# ── Build ──────────────────────────────────────────────────────────────────────
[build]
builder        = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# ── Deploy ─────────────────────────────────────────────────────────────────────
[deploy]
# Gateway listens on $PORT (injected by Railway). All other services listen on
# their gRPC port set via AUTH_GRPC_ADDR / PROFILE_GRPC_ADDR etc.
startCommand   = "node src/gateway/server.js"

# Run schema migration before each gateway deployment goes live.
# This is safe because migrate.js uses CREATE TABLE IF NOT EXISTS / ALTER IGNORE.
preDeployCommand = "node database/migrate.js"

# Railway calls GET /health every 30s; 2xx = healthy, anything else = restart.
healthcheckPath    = "/health"
healthcheckTimeout = 120

# Restart on crash, up to 5 times before Railway marks the deployment failed.
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Single replica by default — scale up in the Railway dashboard when needed.
numReplicas = 1
